<style>
:root{--ink:#1f2933;--sub:#52606d;--line:#d9e2ec;--bg:#f7f9fb;--card:#fff;--main:#0b6e99;--main-ink:#fff;--accent:#e6f6ff}
@media (prefers-color-scheme:dark){:root{--ink:#e4e7eb;--sub:#9aa5b1;--line:#323f4b;--bg:#121a21;--card:#1b2631;--main:#4fb3e0;--main-ink:#0b1b26;--accent:#16324a}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
a{color:var(--main)}img{max-width:100%;height:auto}
header.site{background:var(--card);border-bottom:1px solid var(--line)}
header.site .in{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header.site .brand{font-weight:700;color:var(--ink);text-decoration:none}
header.site nav{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
main{max-width:880px;margin:0 auto;padding:24px 16px 48px}
.pr{font-size:13px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 20px}
h1{font-size:26px;line-height:1.4;margin:8px 0 16px}h2{font-size:20px;margin:32px 0 12px;padding-bottom:4px;border-bottom:2px solid var(--line)}h3{font-size:17px;margin:24px 0 8px}
blockquote{margin:12px 0;padding:10px 14px;background:var(--card);border-left:4px solid var(--main);border-radius:4px}
.table{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card)}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
a.btn{display:inline-block;margin:8px 0;padding:12px 20px;background:var(--main);color:var(--main-ink);border-radius:10px;font-weight:700;text-decoration:none}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));padding:0;list-style:none}
.cards li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
footer.site{border-top:1px solid var(--line);background:var(--card);font-size:13px;color:var(--sub)}
footer.site .in{max-width:880px;margin:0 auto;padding:16px}
footer.site nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
</style>
<script src="/assets/ref-keeper.js" defer></script>
</head>
